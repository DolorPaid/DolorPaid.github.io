<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus Messenger — Вход</title>
    <link rel="stylesheet" href="auth.css">
</head>

<body>
    <!-- Background animations -->
    <div class="bg-animation"></div>
    <div class="particles">
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
    </div>

    <div class="container">
        <!-- Logo Section -->
        <div class="logo-section">
            <div class="logo">💬</div>
            <h1 class="brand-name">Nexus</h1>
            <p class="brand-tagline">Соединяем людей</p>
        </div>

        <!-- Login Card -->
        <div class="login-card">
            <div class="success-checkmark" id="successCheckmark">✓</div>

            <div class="login-header" id="loginHeader">
                <h2 class="login-title">С возвращением!</h2>
                <p class="login-subtitle">Введите данные для входа</p>
            </div>

            <div class="error-message" id="errorMessage">
                Неверный email или пароль
            </div>

            <form id="loginForm" novalidate>
                <div class="form-group">
                    <label class="form-label" for="email">username</label>
                    <div class="input-wrapper">
                        <span class="input-icon">👤</span>
                        <input type="text" id="name" class="form-input" placeholder="myname" autocomplete="name"
                            required>
                        <span class="validation-icon error" id="emailError">❌</span>
                        <span class="validation-icon success" id="emailSuccess">✓</span>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label" for="password">Пароль</label>
                    <div class="input-wrapper">
                        <span class="input-icon">🔒</span>
                        <input type="password" id="password" class="form-input" placeholder="••••••••"
                            autocomplete="current-password" required minlength="6">
                        <button type="button" class="password-toggle" id="togglePassword"
                            title="Показать/скрыть пароль">
                            👁️
                        </button>
                        <span class="validation-icon error" id="passwordError">❌</span>
                        <span class="validation-icon success" id="passwordSuccess">✓</span>
                    </div>
                </div>

                <div class="options-row">
                    <label class="remember-me">
                        <input type="checkbox" id="rememberMe" checked>
                        <span class="checkbox-custom"></span>
                        <span class="remember-label">Запомнить меня</span>
                    </label>
                    <a href="#" class="forgot-password">Забыли пароль?</a>
                </div>

                <button type="submit" class="submit-btn" id="submitBtn">
                    <span class="btn-text">Войти</span>
                    <div class="spinner"></div>
                </button>
            </form>

            <div class="login-footer">
                Ещё нет аккаунта?
                <a href="#" class="register-link">Зарегистрироваться</a>
            </div>
        </div>
    </div>

    <script src="auth.js"></script>
</body>

</html>
